name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # HACS offers releases, so the tag must match what Home Assistant shows.
      - name: Tag matches the manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/climate_hub/manifest.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME"
      # checkout leaves the tag without its message; fetch the annotated tag itself.
      - name: Release notes from the tag message
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
