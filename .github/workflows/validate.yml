name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Home Assistant and HACS change their rules without a commit here.
    - cron: "0 3 * * *"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # No brand image yet (own work package). Remove "brands" from this list once
          # custom_components/climate_hub/brand/icon.png exists.
          ignore: brands
